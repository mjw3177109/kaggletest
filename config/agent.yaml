agent:
  name: Kaggle Auto Scientist
  version: V2.2
  mode: auto_compete

scout:
  page_size: 100
  max_candidates: 20
  prefer_categories:
    - playground
    - gettingStarted
    - featured
  min_days_remaining: 2
  max_team_count_for_bonus: 5000

v2:
  categories:
    - playground
    - gettingStarted
  page_size: 100
  min_days_remaining: 2
  profile_rows: 50000
  kernel_timeout_seconds: 3300
  kernel_poll_seconds: 20
  auto_submit: true
  prefer_cpu_for_tabular: true

v22:
  # Optuna 搜索配置：先在分层抽样数据上调参，再用全量 3 折评估
  trials: 8
  tuning_rows: 120000
  tuning_folds: 2
  full_folds: 3
  seed: 20261018
  min_cv_improvement: 0.00008
  kernel_timeout_seconds: 3600
  poll_timeout_seconds: 3200
  auto_submit: true
  max_new_submissions: 1
  use_gpu: false

safety:
  auto_accept_rules: false
  auto_join_competitions: false
  never_commit_credentials: true
  never_commit_raw_competition_data: true

output:
  competitions_json: state/competitions.json
  latest_report: reports/scout_latest.md
  v2_status: state/v2_status.json
  v2_report: reports/v2_latest.md
