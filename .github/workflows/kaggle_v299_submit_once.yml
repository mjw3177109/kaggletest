name: Kaggle V2.9.9 One-shot Official Submission

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Submit one CV-gated V299 candidate, or read-only recover status"
        type: choice
        required: true
        default: submit_once
        options:
          - submit_once
          - recover_only
  push:
    branches:
      - feature/v29-autonomous-evolution
    paths:
      - ".github/workflows/kaggle_v299_submit_once.yml"

permissions:
  contents: write

concurrency:
  group: kaggle-s6e10-one-shot-official-v299
  cancel-in-progress: false

jobs:
  submit-v299:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
      REQUESTED_MODE: ${{ inputs.mode || 'submit_once' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v29-autonomous-evolution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recheck full OOF gate, competition and one-shot state
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          def read(path):
              p=Path("state")/path
              return json.loads(p.read_text()) if p.exists() else {}
          requested=os.environ.get("REQUESTED_MODE","submit_once")
          submission=read("v2_9_9_submission.json")
          validated=read("v2_9_9_status.json")
          incumbent=read("v2_9_6_status.json")
          newer=read("v2_9_12_status.json")
          ladder=read("dual_ladder.json")
          try:
              deadline=datetime.fromisoformat(ladder.get("active_deadline","").replace("Z","+00:00"))
              active=deadline.tzinfo is not None and datetime.now(timezone.utc)<deadline
          except ValueError:
              active=False
          newcmp=newer.get("comparison") or {}
          stronger=(newer.get("stage")=="candidate_ready_unsubmitted"
                 and float(newcmp.get("candidate_auc",0))>=.9611161936366048)
          cv_ok=(validated.get("stage")=="candidate_ready_unsubmitted"
               and validated.get("submitted") is False
               and abs(float(validated.get("candidate_cv",0))-.9610561936366048)<.000002
               and float(validated.get("gain",0))>=.00010
               and int(validated.get("positive_folds",0))==3
               and min(validated.get("fold_gain") or [-1])>-.00005)
          official_ok=(incumbent.get("stage")=="complete" and incumbent.get("submitted") is True
               and str((incumbent.get("latest_submission") or {}).get("ref"))=="57408736")
          allow=(active and ladder.get("active_competition")=="playground-series-s6e10"
                 and cv_ok and official_ok and not stronger
                 and requested=="submit_once" and not submission)
          recovery=requested=="recover_only" or bool(submission)
          print("allowed="+str(allow).lower())
          print("recovery="+str(recovery).lower())
          PY

      - name: Install exact Kaggle CLI and scientific OOF reconstruction
        if: steps.gate.outputs.allowed == 'true' || steps.gate.outputs.recovery == 'true'
        run: python -m pip install -r requirements.txt numpy pandas scipy scikit-learn

      - name: Compile and test exact one-shot submission safety
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python -m py_compile kaggle_agent/v299_submit.py
          python -m unittest discover -s tests -p 'test_v299_submit.py' -v

      - name: Reconstruct Kaggle 299844-row predictions, verify SHA, reserve ONE quota slot
        if: steps.gate.outputs.allowed == 'true'
        run: |
          test -n "$KAGGLE_API_TOKEN"
          test "$KAGGLE_USERNAME" = "mjw3177109"
          python kaggle_agent/v299_submit.py --reserve

      - name: DURABLY commit and push V299 reservation BEFORE submit
        id: reservation
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          git add -- state/v2_9_9_submission.json reports/v2_9_9_submission.md
          test -n "$(git diff --cached --name-only)" || exit 1
          git commit -m "bot: reserve exact one-shot V299 fixed four-model submission"
          for attempt in 1 2 3; do
            git pull --rebase origin feature/v29-autonomous-evolution
            if git push origin HEAD:feature/v29-autonomous-evolution; then
              echo "reserved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$((attempt*3))"
          done
          exit 1

      - name: Submit Kaggle once only after committed reservation
        if: steps.reservation.outputs.reserved == 'true'
        env:
          V299_RESERVED_COMMITTED: "true"
        run: python kaggle_agent/v299_submit.py --submit

      - name: Read-only Kaggle scoring recovery (never submit)
        if: steps.gate.outputs.recovery == 'true'
        run: python kaggle_agent/v299_submit.py --recover

      - name: ALWAYS commit official Kaggle result or ambiguous error evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          git add -A -- state/v2_9_9_submission.json reports/v2_9_9_submission.md state/v2_9_experiments.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: official Kaggle V299 Public LB / recovery evidence"
          for attempt in 1 2 3; do
            git pull --rebase origin feature/v29-autonomous-evolution
            if git push origin HEAD:feature/v29-autonomous-evolution; then exit 0; fi
            sleep "$((attempt*3))"
          done
          exit 1

      - name: Archive submission provenance only, no raw data or predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v299-official-score-proof
          path: |
            state/v2_9_9_submission.json
            reports/v2_9_9_submission.md
          if-no-files-found: ignore
