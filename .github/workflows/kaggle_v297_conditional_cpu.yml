name: Kaggle V2.9.7 Conditional TE CPU Challenger

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run CPU model once, or only recover existing Notebook"
        required: false
        type: choice
        default: run
        options:
          - run
          - recover_existing
  push:
    branches:
      - feature/v29-autonomous-evolution
    paths:
      - ".github/workflows/kaggle_v297_conditional_cpu.yml"
      - "kaggle_agent/v297_*.py"
      - "tests/test_v297_*.py"

permissions:
  contents: write

# CPU must not reserve any Kaggle GPU/TPU resources.
concurrency:
  group: kaggle-v297-cpu-s6e10
  cancel-in-progress: false

jobs:
  independent-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gate competition validity and avoid repeated CPU experiment
        id: gate
        env:
          INPUT_MODE: ${{ inputs.mode || 'run' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          def read(name):
              f=Path("state")/name
              return json.loads(f.read_text(encoding="utf-8")) if f.exists() else {}
          focus=read("dual_ladder.json")
          last=read("v2_9_7_status.json")
          deadline=focus.get("active_deadline") or ""
          try:
              dt=datetime.fromisoformat(deadline.replace("Z","+00:00"))
              valid=dt.tzinfo is not None and datetime.now(timezone.utc)<dt
          except ValueError:
              valid=False
          terminal={"skipped_no_cv_gain","candidate_ready_unsubmitted",
                    "kernel_failed","output_failed","validation_mismatch",
                    "push_failed","kernel_access_error"}
          valid=(valid and focus.get("active_competition")=="playground-series-s6e10"
                 and last.get("stage") not in terminal)
          mode=os.environ.get("INPUT_MODE") or "run"
          if last.get("kernel"):
              mode="recover_existing"
          print("allowed="+str(valid).lower())
          print("mode="+mode)
          PY

      - name: Install Kaggle CLI and scientific evaluation dependencies
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python -m pip install -r requirements.txt numpy pandas scipy scikit-learn lightgbm

      - name: Compile and verify strict CV leakage regression
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python -m py_compile kaggle_agent/v297_conditional_cpu_train.py kaggle_agent/v297_pipeline.py
          python -m unittest discover -s tests -p 'test_v297_*.py' -v

      - name: Run exactly one new independent CPU Kaggle Notebook or recover
        id: experiment
        if: steps.gate.outputs.allowed == 'true'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo "Missing Kaggle token"; exit 1; }
          test "$KAGGLE_USERNAME" = "mjw3177109" || { echo "Unexpected user account"; exit 1; }
          if [ "$MODE" = "recover_existing" ]; then
            python kaggle_agent/v297_pipeline.py --recover-only
          else
            python kaggle_agent/v297_pipeline.py
          fi

      - name: Persist authenticated Kaggle stage and candidate-only CV audit
        if: always() && steps.gate.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f state/v2_9_7_status.json; then
            echo "No CPU candidate state generated."
            exit 0
          fi
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          git add -A -- state/v2_9_7_status.json state/v2_9_experiments.json reports/v2_9_7_conditional_cpu.md
          if test -d competitions/playground-series-s6e10/kaggle_cpu_v297; then
            git add -A -- competitions/playground-series-s6e10/kaggle_cpu_v297/
          fi
          if git diff --cached --quiet; then
            echo "No new verified experiment evidence."
            exit 0
          fi
          git commit -m "bot: V2.9.7 independent CPU conditional-TE evidence"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1

      - name: Upload safe metrics only, not competition data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v297-cpu-conditional-cv
          path: |
            state/v2_9_7_status.json
            reports/v2_9_7_conditional_cpu.md
          if-no-files-found: ignore
