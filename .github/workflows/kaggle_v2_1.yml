name: Kaggle Auto Scientist V2.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaggle-auto-scientist-v2-1
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install controller dependencies
        run: pip install -r requirements.txt

      - name: Verify Kaggle authentication
        shell: bash
        run: |
          test -n "$KAGGLE_API_TOKEN" || (echo "Missing KAGGLE_API_TOKEN" && exit 1)
          kaggle competitions list --category playground --page-size 3 --format json >/dev/null
          echo "Kaggle authentication OK"

      - name: Sync latest main before execution
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Run V2.1 optimizer
        run: |
          python kaggle_agent/v2_1_pipeline.py
          python kaggle_agent/beginner_guide.py

      - name: Commit V2.1 experiments, beginner guide and results
        shell: bash
        run: |
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"

          # Never rerun Kaggle training during a GitHub write-back conflict.

          git add state/ reports/ competitions/
          if git diff --cached --quiet; then
            echo "No V2.1 changes to commit."
            exit 0
          fi

          git commit -m "bot: Kaggle Auto Scientist V2.1 optimize"
          git pull --rebase origin main
          git push origin main
