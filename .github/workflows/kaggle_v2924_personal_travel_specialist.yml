name: Kaggle V2.9.24 Personal-Travel Specialist Residual Correction

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run one owner-verified CPU Notebook or recover the existing one"
        type: choice
        required: false
        default: run
        options:
          - run
          - recover_existing
  push:
    branches:
      - feature/v29-autonomous-evolution
    paths:
      - ".github/workflows/kaggle_v2924_personal_travel_specialist.yml"
      - "kaggle_agent/v2924_pipeline.py"
      - "kaggle_agent/v2924_personal_travel_specialist_train.py"
      - "tests/test_v2924_personal_travel.py"

permissions:
  contents: write

concurrency:
  group: kaggle-s6e10-v2924-personal-travel-specialist
  cancel-in-progress: false

jobs:
  train-and-evaluate-once:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
      REQUESTED_MODE: ${{ inputs.mode || 'run' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v29-autonomous-evolution
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight frozen champion, terminal V2923, deadline and unique V2924 state
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          def read(name):
              p=Path("state")/name
              return json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          official=read("v2_9_15_submission.json")
          champion=read("v2_9_15_status.json")
          ranking=read("score_rank_latest.json")
          ladder=read("dual_ladder.json")
          v16=read("v2_9_16_status.json")
          v21=read("v2_9_21_status.json")
          v23=read("v2_9_23_status.json")
          trial=read("v2_9_24_status.json")
          sub=official.get("submission") or {}
          score=ranking.get("score") or {}
          c16=v16.get("comparison") or {}
          c21=v21.get("comparison") or {}
          c23=v23.get("comparison") or {}
          try:
              deadline=datetime.fromisoformat(str(ladder.get("active_deadline","")).replace("Z","+00:00"))
              active=deadline.tzinfo is not None and datetime.now(timezone.utc)<deadline
          except (TypeError,ValueError):
              active=False
          terminal={"candidate_ready_unsubmitted","skipped_no_cv_gain","kernel_failed",
                    "output_failed","validation_mismatch","push_failed","kernel_access_error"}
          v23msg=str(v23.get("kernel_message") or "")
          v23terminal=(v23.get("stage")=="skipped_no_cv_gain"
              and v23.get("kernel_state")=="kernel_complete"
              and "KernelWorkerStatus.COMPLETE" in v23msg
              and "KernelWorkerStatus.RUNNING" not in v23msg
              and v23.get("submitted") is False
              and float(c23.get("gain",1))<0)
          allowed=(active and ladder.get("active_competition")=="playground-series-s6e10"
              and official.get("stage")=="complete" and official.get("submitted") is True
              and official.get("submission_attempted") is True
              and str(sub.get("ref"))=="57446286"
              and sub.get("status")=="SubmissionStatus.COMPLETE"
              and abs(float(official.get("official_lb",0))-.96099)<1e-9
              and official.get("prediction_hash")==champion.get("candidate_test_hash")
              and champion.get("stage")=="candidate_ready_unsubmitted"
              and abs(float((champion.get("comparison") or {}).get("candidate_auc",0))-.9612850399332336)<.000002
              and str(score.get("submission_id"))=="57446286"
              and abs(float(score.get("public_score",0))-.96099)<1e-9
              and v16.get("stage")=="skipped_no_cv_gain" and v16.get("submitted") is False
              and abs(float(c16.get("candidate_auc",0))-.9613243650285448)<.000002
              and float(c16.get("gain",1))<.00005
              and v21.get("stage")=="skipped_no_cv_gain" and v21.get("submitted") is False
              and abs(float(c21.get("candidate_auc",0))-.9612213583225888)<.000002
              and float(c21.get("gain",1))<0
              and v23terminal
              and trial.get("stage") not in terminal
              and (not trial.get("kernel") or trial.get("kernel")=="mjw3177109/kas-v2924-personal-travel-specialist-cpu-s6e10"))
          mode=os.getenv("REQUESTED_MODE") or "run"
          if trial.get("kernel"):
              mode="recover_existing"
          print("allowed="+str(bool(allowed)).lower())
          print("mode="+mode)
          print("reason="+("all_preflight_gates_passed" if allowed else "blocked_by_champion_or_terminal_status_gate"))
          PY

      - name: Install audit dependencies
        if: steps.gate.outputs.allowed == 'true'
        run: python -m pip install -r requirements.txt numpy pandas scipy scikit-learn

      - name: Compile model and run leakage-safety regression tests
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          python -m py_compile kaggle_agent/v2924_pipeline.py kaggle_agent/v2924_personal_travel_specialist_train.py
          python -m unittest discover -s tests -p 'test_v2924_personal_travel.py' -v

      - name: Train one owner-verified Notebook or recover existing Notebook
        if: steps.gate.outputs.allowed == 'true'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          set -euo pipefail
          test "$KAGGLE_USERNAME" = "mjw3177109"
          test -n "$KAGGLE_API_TOKEN"
          if test "$MODE" = "recover_existing"; then
            python kaggle_agent/v2924_pipeline.py --recover-only
          else
            python kaggle_agent/v2924_pipeline.py
          fi

      - name: Persist verified status, report and candidate only
        if: always() && steps.gate.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          for file in state/v2_9_24_status.json state/v2_9_experiments.json reports/v2_9_24_personal_travel_specialist.md; do
            if test -f "$file"; then git add -- "$file"; fi
          done
          if test -f competitions/playground-series-s6e10/results_v2924_personal_travel/candidate_submission.csv; then
            git add -- competitions/playground-series-s6e10/results_v2924_personal_travel/candidate_submission.csv
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: persist V2924 Personal Travel specialist evaluation"
          for attempt in 1 2 3; do
            git pull --rebase origin feature/v29-autonomous-evolution
            if git push origin HEAD:feature/v29-autonomous-evolution; then exit 0; fi
            sleep "$((attempt*3))"
          done
          exit 1

      - name: Archive reproducible OOF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2924-personal-travel-specialist-evidence
          path: |
            state/v2_9_24_status.json
            reports/v2_9_24_personal_travel_specialist.md
            competitions/playground-series-s6e10/results_v2924_personal_travel/raw/v2924_metrics.json
            competitions/playground-series-s6e10/results_v2924_personal_travel/raw/v2924_personal_travel_oof.npz
            competitions/playground-series-s6e10/results_v2924_personal_travel/candidate_submission.csv
          if-no-files-found: ignore
