name: Kaggle Latest Authenticated Public Rank Refresh
# 2026-10-25 02:45 UTC: V2936 terminal environment mismatch, V2937 preregistered; refresh authenticated Public rank read-only, no Notebook or submission.
# 2026-10-25 00:17 UTC: V2935 immutable OOF complete; read-only authenticated Public rank refresh, never train/push/submit.
# 2026-10-24 21:45 UTC: V2934 implementation review, authenticated read-only Public rank recheck; no GPU, Notebook push or submission.
# 2026-10-24 20:14 UTC: read-only authenticated Public rank check after V2933 terminal; no training or submission.
# 2026-10-24 19:52 UTC: authenticated read-only rank check after V2933 unique Notebook QUEUED; never train or submit.
# 2026-10-24 16:12 UTC: V2931 completed; one authenticated read-only Public rank refresh; no Notebook, training, or submission.
# 2026-10-24 18:12 UTC: read-only Public rank refresh after V2932 terminal; no new submission.
# 2026-10-24 13:02 UTC: guarded read-only authenticated rank check during V2930 queued; no Notebook push or submission.
# 2026-10-24 09:18 UTC: one authenticated read-only rank recheck after >4h; no Notebook push or submission.
# 2026-10-24 04:48 UTC: single guarded read-only authenticated Public rank refresh; no Notebook, training, or submission.
# 2026-10-24 00:00 UTC: guarded authenticated Public rank read-only recheck; no training, Notebook creation, or submission.
# 2026-10-23 19:40 UTC: one read-only authenticated rank recheck; no Kaggle training or submission.
# 2026-10-23 17:10 UTC: single safe read-only authenticated rank refresh after 4h; no training or submission.
# 2026-10-23 10:44 UTC: scheduled read-only authenticated rank recheck; never submit.
# 2026-10-23 12:40 UTC: read-only authenticated rank refresh after two-hour interval; no training or submission.
# 2026-10-22: one authenticated read-only rank refresh; no submission action.

# 2026-10-25 safety freeze: dispatch-only. No push-triggered authenticated
# Kaggle API access while pacing and fail-closed protections are under review.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaggle-v299-public-rank-audit
  cancel-in-progress: false

jobs:
  verified-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v29-autonomous-evolution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install -r requirements.txt

      - name: Verify current scored source, rank identity and no guessed place
        run: |
          test "$KAGGLE_USERNAME" = "mjw3177109"
          test -n "$KAGGLE_API_TOKEN"
          python -m unittest discover -s tests -p 'test_v24_rank_tracker.py' -v
          python -m unittest discover -s tests -p 'test_v299_rank_refresh.py' -v
          python -m unittest discover -s tests -p 'test_v2915_rank_refresh.py' -v

      - name: Fetch authenticated Kaggle Public rank for current scored submission
        run: |
          python kaggle_agent/v24_rank_tracker.py
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"kaggle_agent")
          from v24_rank_tracker import candidates_for
          s=json.loads(Path("state/score_rank_latest.json").read_text())
          model=s.get("score") or {}
          authoritative=candidates_for("playground-series-s6e10")
          if authoritative is None:
              raise RuntimeError("No verified scored Kaggle submission exists")
          if (s.get("competition")!="playground-series-s6e10"
              or model.get("submission_id")!=authoritative["submission_id"]
              or model.get("source")!=authoritative["source"]
              or abs(float(model.get("public_score",0))-
                     authoritative["public_score"])>1e-9):
              raise RuntimeError("Refuse stale, guessed or mismatched official Public rank")
          print("Authenticated scored submission:",authoritative["submission_id"])
          print("Official scored Public LB:",authoritative["public_score"])
          print("Authenticated rank:",s.get("rank"),"Teams:",s.get("ranked_teams"))
          print("Rank source:",s.get("rank_source"),"Checked UTC:",s.get("checked_at"))
          if s.get("rank") is None:
              print("OFFICIAL RANK UNKNOWN - do not infer a rank from score")
          PY

      - name: Commit updated ranked score evidence to feature branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          git add -- state/score_rank_latest.json reports/score_rank_latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: refresh Kaggle authenticated public rank for current scored champion"
          for attempt in 1 2 3; do
            git pull --rebase origin feature/v29-autonomous-evolution
            if git push origin HEAD:feature/v29-autonomous-evolution; then exit 0; fi
            sleep "$((attempt*3))"
          done
          exit 1

      - name: Publish rank evidence without competition data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-authenticated-public-rank
          path: |
            state/score_rank_latest.json
            reports/score_rank_latest.md
          if-no-files-found: ignore
