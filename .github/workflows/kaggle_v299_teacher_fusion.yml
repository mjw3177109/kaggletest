name: Kaggle V2.9.9 Archived Teacher Fusion

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v29-autonomous-evolution
    paths:
      - ".github/workflows/kaggle_v299_teacher_fusion.yml"
      - "kaggle_agent/v299_*.py"
      - "tests/test_v299_*.py"
      - "state/v2_9_8_status.json"

permissions:
  contents: write

concurrency:
  group: kaggle-v299-archived-only
  cancel-in-progress: false

jobs:
  teacher-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v29-autonomous-evolution
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gate completed V298 and dedupe teacher audit
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          def read(path):
              p=Path(path)
              return json.loads(p.read_text()) if p.exists() else {}
          v298=read("state/v2_9_8_status.json")
          v299=read("state/v2_9_9_status.json")
          terminal={"candidate_ready_unsubmitted","skipped_no_cv_gain","validation_blocked"}
          allowed=v298.get("stage") in terminal and v299.get("stage") not in terminal
          print("allowed="+str(allowed).lower())
          PY

      - name: Install Kaggle read-only evaluator packages
        if: steps.gate.outputs.allowed == 'true'
        run: python -m pip install -r requirements.txt numpy pandas scipy scikit-learn

      - name: Confirm account, deadline and regression safety
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          test "$KAGGLE_USERNAME" = "mjw3177109"
          test -n "$KAGGLE_API_TOKEN"
          python -m py_compile kaggle_agent/v299_teacher_fusion.py
          python -m unittest discover -s tests -p 'test_v299_*.py' -v
          python - <<'PY'
          import sys
          sys.path.insert(0,"kaggle_agent")
          import v298_fusion
          v298_fusion.check_competition()
          PY

      - name: Evaluate historical teacher OOF once, no Kaggle submit
        if: steps.gate.outputs.allowed == 'true'
        run: python kaggle_agent/v299_teacher_fusion.py

      - name: Commit metrics and provenances only
        if: success() && steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          git add -- state/v2_9_9_status.json state/v2_9_experiments.json reports/v2_9_9_teacher_audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: record V299 archived teacher OOF audit"
          for attempt in 1 2 3; do
            git pull --rebase origin feature/v29-autonomous-evolution
            if git push origin HEAD:feature/v29-autonomous-evolution; then exit 0; fi
            sleep "$((attempt*3))"
          done
          exit 1

      - name: Upload safe V299 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v299-archived-teacher-metrics
          path: |
            state/v2_9_9_status.json
            reports/v2_9_9_teacher_audit.md
          if-no-files-found: ignore
