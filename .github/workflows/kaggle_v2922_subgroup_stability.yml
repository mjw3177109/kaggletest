name: Kaggle V2.9.22 OOF Subgroup Stability Audit

on:
  workflow_dispatch:
  push:
    branches: [feature/v29-autonomous-evolution]
    paths:
      - ".github/workflows/kaggle_v2922_subgroup_stability.yml"
      - "kaggle_agent/v2922_subgroup_stability.py"
      - "tests/test_v2922_subgroup_stability.py"

permissions:
  contents: write

concurrency:
  group: kaggle-s6e10-v2922-readonly-subgroup-audit
  cancel-in-progress: false

jobs:
  subgroup-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v29-autonomous-evolution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated diagnostic dependencies
        run: python -m pip install -r requirements.txt numpy pandas scipy scikit-learn
      - name: Compile and test OOF alignment and subgroup diagnostics
        run: |
          set -euo pipefail
          python -m py_compile kaggle_agent/v2922_subgroup_stability.py
          python -m unittest discover -s tests -p 'test_v2922_subgroup_stability.py' -v
      - name: Require all four authentic terminal OOF candidates
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          states=Path("state")
          models=[
            ("v2_9_18_status.json","mjw3177109/kas-v2918-routeprofile-lightgbm-cpu-s6e10"),
            ("v2_9_19r2_status.json","mjw3177109/kas-v2919r2-tabm-fixed-te23-t4-s6e10"),
            ("v2_9_20_status.json","mjw3177109/kas-v2920-routeprofile-xgboost-hist-cpu-s6e10"),
            ("v2_9_21_status.json","mjw3177109/kas-v2921-catboost-native-route-cpu-s6e10"),
          ]
          terminal={"candidate_ready_unsubmitted","skipped_no_cv_gain"}
          reasons=[]
          for filename,kernel in models:
              path=states/filename
              if not path.exists():
                  reasons.append(filename+":missing")
                  continue
              s=json.loads(path.read_text())
              if s.get("stage") not in terminal: reasons.append(filename+":not_terminal")
              if s.get("submitted") is not False: reasons.append(filename+":submission_flag")
              if s.get("kernel")!=kernel: reasons.append(filename+":kernel_mismatch")
              if (s.get("metrics") or {}).get("stage")!="three_folds_complete":
                  reasons.append(filename+":OOF_incomplete")
              if len((s.get("metrics") or {}).get("fold_results") or [])!=3:
                  reasons.append(filename+":fold_count")
          ready=not reasons
          print("ready="+str(ready).lower())
          print("reason="+(",".join(reasons) if reasons else "all_four_terminal_OOF_artifacts_verified"))
          print("PYTHON_DIAGNOSTIC_ONLY=true")
          PY
      - name: Retrieve OOF artifacts and compute subgroup diversity
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          test "$KAGGLE_USERNAME" = "mjw3177109"
          test -n "$KAGGLE_API_TOKEN"
          python kaggle_agent/v2922_subgroup_stability.py
      - name: Persist verified diagnostic report only
        if: always() && steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          git add -- reports/v2_9_22_subgroup_stability.json reports/v2_9_22_subgroup_stability.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: V2922 common OOF subgroup and diversity diagnostic"
          for attempt in 1 2 3; do
            git pull --rebase origin feature/v29-autonomous-evolution
            if git push origin HEAD:feature/v29-autonomous-evolution; then exit 0; fi
            sleep "$((attempt*3))"
          done
          exit 1
      - name: Archive test and diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2922-subgroup-stability-audit
          path: |
            reports/v2_9_22_subgroup_stability.json
            reports/v2_9_22_subgroup_stability.md
          if-no-files-found: ignore
          retention-days: 14
