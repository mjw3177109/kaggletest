name: Kaggle V2942 Preregistration Offline Safety
on:
  push:
    branches:
      - feature/v29-autonomous-evolution
    paths:
      - state/v2_9_41_status.json
      - state/v2_9_42_status.json
      - reports/v2_9_42_preregistration.md
      - tests/test_v2942_prereg_safety.py
      - .github/workflows/kaggle_v2942_prereg_safety.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kaggle-v2942-prereg-safety
  cancel-in-progress: false
jobs:
  preregistration-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v29-autonomous-evolution
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline preregistration assertions (no model fitting, Kaggle or secrets)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v2942_prereg_safety.py' -v
