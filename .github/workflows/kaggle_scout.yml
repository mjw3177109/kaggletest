name: Kaggle Scout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "config/**"
      - "kaggle_agent/**"
      - ".github/workflows/kaggle_scout.yml"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Kaggle token exists
        shell: bash
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN secret is missing."
            exit 1
          fi
          echo "KAGGLE_API_TOKEN is configured."

      - name: Test Kaggle authentication
        run: kaggle competitions list --page-size 5

      - name: Discover and rank competitions
        run: python kaggle_agent/scout.py

      - name: Commit generated scout state
        shell: bash
        run: |
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          git add state/competitions.json reports/scout_latest.md
          if git diff --cached --quiet; then
            echo "No scout changes to commit."
            exit 0
          fi
          git commit -m "bot: refresh Kaggle competition scout"
          git push
