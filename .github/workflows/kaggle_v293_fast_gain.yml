name: Kaggle V2.9.3 Real CPU OOF Fast Gain

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Evaluate new real Kaggle OOF blend or recover scored submission"
        type: choice
        required: false
        default: evaluate
        options:
          - evaluate
          - recover
  push:
    branches:
      - feature/v29-autonomous-evolution
    paths:
      # Scope legacy V2.9.3 to its own files only; v2930_* must not retrigger
      # a terminal V2.9.3 experiment or its one-shot submission machinery.
      - "kaggle_agent/v293_*.py"
      - "tests/test_v293_*.py"

permissions:
  contents: write

# Shares a ledger with the V2.9 audit job. Never run both at the same time.
concurrency:
  group: kaggle-v29-evolution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validated CPU analysis and Kaggle CLI dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt numpy scipy scikit-learn

      - name: Compile and run real-experiment safety tests
        id: tests
        run: |
          python -m py_compile kaggle_agent/v293_blend_math.py kaggle_agent/v293_pipeline.py
          python -m unittest discover -s tests -p 'test_v293*.py' -v

      - name: Verify Kaggle secret presence without revealing values
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'evaluate'
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo "Kaggle API token missing"; exit 1; }
          test -n "$KAGGLE_USERNAME" || { echo "Kaggle username missing"; exit 1; }

      - name: Download actual owner OOF, evaluate 4 fixed fusion candidates and gate CV
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'evaluate'
        id: experiment
        run: python kaggle_agent/v293_pipeline.py --evaluate

      - name: Persist evaluated experiment before any possible submission
        if: steps.experiment.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          git add -A -- state/v2_9_3_status.json state/v2_9_experiments.json reports/v2_9_3_latest.md
          if ! git diff --cached --quiet; then
            git commit -m "bot: V2.9.3 real OOF experiment evaluated"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Verify candidate is eligible for ONE new Kaggle submission
        if: steps.experiment.outcome == 'success'
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          state=json.loads(Path("state/v2_9_3_status.json").read_text(encoding="utf-8"))
          result=state.get("result") or {}
          selected=next((c for c in result.get("candidates",[])
                         if c.get("candidate")==result.get("candidate")),{})
          fold_gain=selected.get("fold_gain_vs_v28") or []
          robust=len(fold_gain)==3 and all(float(x)>0 for x in fold_gain)
          eligible=(state.get("stage")=="candidate_ready" and
                    result.get("cv_auc",0)>=state.get("benchmark_cv",1)+0.00002 and
                    robust and not state.get("submission_attempted",False))
          print("ready="+str(eligible).lower())
          PY

      - name: Reserve one-shot Kaggle submission
        if: steps.gate.outputs.ready == 'true'
        run: python kaggle_agent/v293_pipeline.py --reserve

      - name: Persist reservation BEFORE calling Kaggle submit
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          git add -- state/v2_9_3_status.json reports/v2_9_3_latest.md
          test -n "$(git diff --cached --name-only)" || { echo "Missing reservation changes"; exit 1; }
          git commit -m "bot: reserve exactly one V2.9.3 Kaggle submission"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Submit only the CV-verified, hash-locked candidate
        if: steps.gate.outputs.ready == 'true'
        env:
          V293_RESERVED_COMMITTED: "true"
        run: python kaggle_agent/v293_pipeline.py --submit

      - name: Read-only recovery of an existing submission
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'recover'
        run: python kaggle_agent/v293_pipeline.py --recover

      - name: Persist final status or failure diagnostics
        if: always() && steps.tests.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          if test ! -f state/v2_9_3_status.json; then
            echo "Experiment status not created; nothing to write back."
            exit 0
          fi
          git add -A -- state/v2_9_3_status.json state/v2_9_experiments.json reports/v2_9_3_latest.md
          if git diff --cached --quiet; then
            echo "No new V2.9.3 experiment state."
            exit 0
          fi
          git commit -m "bot: V2.9.3 final CV and Kaggle submission audit"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload only non-sensitive experiment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v293-experiment-evidence
          path: |
            state/v2_9_3_status.json
            reports/v2_9_3_latest.md
          if-no-files-found: warn
