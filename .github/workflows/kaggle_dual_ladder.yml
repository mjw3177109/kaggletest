name: Kaggle Dual GPU-TPU Top3 or Deadline Ladder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaggle_dual_ladder.yml"
  schedule:
    - cron: "09 */2 * * *"

permissions:
  contents: write

concurrency:
  group: kaggle-dual-ladder-ranking
  cancel-in-progress: false

jobs:
  rank-and-rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI and YAML
        run: pip install -r requirements.txt

      - name: Test fail-closed top-three gate
        run: |
          python -m py_compile kaggle_agent/v24_dual_ladder.py
          python -m unittest discover -s tests -p test_v24_dual_ladder.py -v

      - name: Verify joined competitions and live PUBLIC rank
        run: python kaggle_agent/v24_dual_ladder.py

      - name: Upload actual rank evidence and next-contest decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-ladder-report
          path: |
            state/dual_ladder.json
            reports/dual_ladder_latest.md
          if-no-files-found: warn

      - name: Preserve independent rank and transition report
        shell: bash
        run: |
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          git add -A -- state/dual_ladder.json reports/dual_ladder_latest.md
          if git diff --cached --quiet; then
            echo "Leaderboard has no material updates"
            exit 0
          fi
          git commit -m "bot: Kaggle live top3 rank and safe contest transition"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Ladder status conflict; diagnostic artifact saved"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Leaderboard and contest-selection state saved"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Explain actual rotation status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('state/dual_ladder.json').read_text(encoding='utf-8'))
          print('Kaggle public rank:',d.get('rank'))
          print('Stage:',d.get('status'))
          print('Deadline:',d.get('active_deadline'))
          print('Hours remaining:',d.get('hours_to_deadline'))
          print('Transition triggers:',d.get('handoff_reasons'))
          print('GPU/TPU:',d.get('gpu_training'),d.get('tpu_training'))
          print('Next contest:',(d.get('next_competition') or {}).get('competition'))
          print('Official prize confirmed:',(d.get('public_top3_achieved') or {}).get('official_prize_confirmed',False))
          PY
