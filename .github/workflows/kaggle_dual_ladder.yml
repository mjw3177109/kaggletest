name: Kaggle Dual GPU-TPU Top3 or Deadline Ladder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaggle_dual_ladder.yml"
  schedule:
    - cron: "09 */2 * * *"
  workflow_run:
    workflows:
      - "Kaggle Auto Scientist V2.3 GPU"
      - "Kaggle V2.3 TPU Recovery"
      - "Kaggle Auto Scientist V2.5 GPU Feature Engineering"
      - "Kaggle Auto Scientist V2.6 GPU Frequency Challenger"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: kaggle-dual-ladder-ranking
  cancel-in-progress: false

jobs:
  rank-and-rotate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI and YAML
        run: pip install -r requirements.txt

      - name: Test fail-closed top-three gate
        run: |
          python -m py_compile kaggle_agent/v24_dual_ladder.py kaggle_agent/v24_rank_tracker.py
          python -m unittest discover -s tests -p test_v24_dual_ladder.py -v
          python -m unittest discover -s tests -p test_v24_rank_tracker.py -v
          python -m unittest discover -s tests -p test_v24_score_report_sync.py -v

      - name: Query authenticated Kaggle rank, team count and current scored submission
        run: python kaggle_agent/v24_rank_tracker.py

      - name: Confirm refreshed official Public rank and apply safe contest handoff
        run: python kaggle_agent/v24_dual_ladder.py

      - name: Attach authenticated rank to every matching score report
        run: python kaggle_agent/v24_score_report_sync.py

      - name: Upload actual rank evidence and next-contest decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-ladder-report
          path: |
            state/dual_ladder.json
            reports/dual_ladder_latest.md
            state/score_rank_latest.json
            reports/score_rank_latest.md
            reports/v2_5_latest.md
            reports/v2_6_latest.md
            reports/v2_3_gpu_latest.md
            reports/v2_3_latest.md
          if-no-files-found: warn

      - name: Preserve independent rank and transition report
        shell: bash
        run: |
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          git add -A -- state/dual_ladder.json reports/dual_ladder_latest.md state/score_rank_latest.json reports/score_rank_latest.md reports/v2_5_latest.md reports/v2_6_latest.md reports/v2_3_gpu_latest.md reports/v2_3_latest.md
          if git diff --cached --quiet; then
            echo "Leaderboard has no material updates"
            exit 0
          fi
          git commit -m "bot: Kaggle live top3 rank and safe contest transition"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Ladder status conflict; diagnostic artifact saved"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Leaderboard and contest-selection state saved"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Explain actual rotation status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('state/dual_ladder.json').read_text(encoding='utf-8'))
          score=json.loads(Path('state/score_rank_latest.json').read_text(encoding='utf-8'))
          print('Kaggle latest public score:',(score.get('score') or {}).get('public_score'))
          print('Kaggle official public rank:',score.get('rank'))
          print('Ranked teams:',score.get('ranked_teams'))
          print('Rank verified at:',score.get('checked_at'))
          print('Rank verified by:',score.get('rank_source'))
          print('Kaggle ladder rank:',d.get('rank'))
          print('Stage:',d.get('status'))
          print('Deadline:',d.get('active_deadline'))
          print('Hours remaining:',d.get('hours_to_deadline'))
          print('Transition triggers:',d.get('handoff_reasons'))
          print('GPU/TPU:',d.get('gpu_training'),d.get('tpu_training'))
          print('Next contest:',(d.get('next_competition') or {}).get('competition'))
          print('Official prize confirmed:',(d.get('public_top3_achieved') or {}).get('official_prize_confirmed',False))
          PY
