name: Kaggle V2.7 OOF Fusion

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Kaggle Auto Scientist V2.6 GPU Frequency Challenger"
    types: [completed]
  schedule:
    - cron: "43 */6 * * *"

permissions:
  contents: write

concurrency:
  group: kaggle-v27-ensemble
  cancel-in-progress: false

jobs:
  verify-and-fuse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt numpy pandas scipy scikit-learn
      - name: Run offline OOF safety tests
        run: python -m unittest discover -s tests -p test_v27.py -v
      - name: Evaluate fixed candidate from owner's prior kernels
        run: python kaggle_agent/v27_oof_blender.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v27-report
          path: |
            state/v2_7_status.json
            reports/v2_7_latest.md
          if-no-files-found: warn
