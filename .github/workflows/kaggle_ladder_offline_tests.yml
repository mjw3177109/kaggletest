name: Kaggle Ladder Offline Tests

on:
  pull_request:
    paths:
      - "kaggle_agent/v24_dual_ladder.py"
      - "tests/test_v24_dual_ladder.py"
      - ".github/workflows/kaggle_ladder_offline_tests.yml"
  push:
    branches: [main]
    paths:
      - "kaggle_agent/v24_dual_ladder.py"
      - "tests/test_v24_dual_ladder.py"
      - ".github/workflows/kaggle_ladder_offline_tests.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile selection logic and run no-network tests
        run: |
          python -m py_compile kaggle_agent/v24_dual_ladder.py
          python -m unittest discover -s tests -p test_v24_dual_ladder.py -v
