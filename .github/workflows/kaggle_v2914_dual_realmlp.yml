name: Kaggle V2.9.14 Dual-Numeric RealMLP Ens8 T4

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Push the single registered T4 notebook once, or recover its existing ID"
        required: false
        type: choice
        default: run
        options: [run, recover_existing]
  push:
    branches:
      - feature/v29-autonomous-evolution
    paths:
      - ".github/workflows/kaggle_v2914_dual_realmlp.yml"
      - "kaggle_agent/v2914_*.py"
      - "tests/test_v2914_*.py"

permissions:
  contents: write

concurrency:
  group: kaggle-v2914-dual-numeric-single-t4
  cancel-in-progress: false

jobs:
  independent-dual-neural:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
      MODE: ${{ inputs.mode || 'run' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v29-autonomous-evolution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify official V2913 champion, archived deadline, dedupe stage
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          def read(name):
              f=Path("state")/name
              return json.loads(f.read_text()) if f.exists() else {}
          previous=read("v2_9_13_status.json")
          scored=read("v2_9_13_submission.json")
          current=read("v2_9_14_status.json")
          ladder=read("dual_ladder.json")
          try:
              deadline=datetime.fromisoformat(str(ladder.get("active_deadline","")).replace("Z","+00:00"))
              active=deadline.tzinfo is not None and datetime.now(timezone.utc)<deadline
          except ValueError:
              active=False
          terminal={"candidate_ready_unsubmitted","skipped_no_cv_gain",
                    "kernel_failed","output_failed","validation_mismatch",
                    "push_failed","kernel_access_error"}
          allow=(active and ladder.get("active_competition")=="playground-series-s6e10"
                 and previous.get("stage")=="candidate_ready_unsubmitted"
                 and abs(float((previous.get("comparison") or {}).get("candidate_auc",0))-.96117635576833)<.000002
                 and scored.get("stage")=="complete" and scored.get("submitted") is True
                 and abs(float(scored.get("official_lb",0))-.96083)<1e-9
                 and str((scored.get("submission") or {}).get("ref"))=="57423879"
                 and current.get("stage") not in terminal)
          mode=os.environ.get("MODE") or "run"
          if current.get("kernel"):mode="recover_existing"
          print("allowed="+str(allow).lower())
          print("mode="+mode)
          PY

      - name: Install trusted Kaggle CLI and independent OOF audit dependencies
        if: steps.gate.outputs.allowed == 'true'
        run: python -m pip install -r requirements.txt numpy pandas scipy scikit-learn

      - name: Compile RealMLP protocol and pass all leakage/dedupe regression tests
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          python -m py_compile kaggle_agent/v2914_dual_realmlp_train.py kaggle_agent/v2914_pipeline.py
          python -m unittest discover -s tests -p 'test_v2914_*.py' -v

      - name: Create exactly ONE authorized T4 notebook or read-only recover
        if: steps.gate.outputs.allowed == 'true'
        env:
          LAUNCH_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          set -euo pipefail
          test "$KAGGLE_USERNAME" = "mjw3177109"
          test -n "$KAGGLE_API_TOKEN"
          if test "$LAUNCH_MODE" = "recover_existing"; then
            python kaggle_agent/v2914_pipeline.py --recover-only
          else
            python kaggle_agent/v2914_pipeline.py
          fi

      - name: Commit only objective training state, OOF AUC, SHA and notebook metadata
        if: always() && steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          git add -A -- state/v2_9_14_status.json state/v2_9_experiments.json reports/v2_9_14_dual_realmlp.md
          if test -d competitions/playground-series-s6e10/kaggle_gpu_v2914; then
            git add -A -- competitions/playground-series-s6e10/kaggle_gpu_v2914/
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: preserve real V2914 dual-numeric T4 Notebook and CV evidence"
          for attempt in 1 2 3; do
            git pull --rebase origin feature/v29-autonomous-evolution
            if git push origin HEAD:feature/v29-autonomous-evolution; then exit 0; fi
            sleep "$((attempt*3))"
          done
          exit 1

      - name: Upload safe status only (exclude full raw OOF and competition data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2914-dual-numeric-realmlp-evidence
          path: |
            state/v2_9_14_status.json
            reports/v2_9_14_dual_realmlp.md
          if-no-files-found: ignore
