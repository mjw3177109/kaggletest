name: Kaggle Auto Scientist V2.8 GPU CatBoost Challenger

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run new V2.8 challenger or only inspect previous Kaggle notebook"
        type: choice
        required: false
        default: run
        options: [run, recover_existing]
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaggle_v28_catboost.yml"
  schedule:
    - cron: "53 * * * *"

permissions:
  contents: write

concurrency:
  group: kaggle-v28-catboost-challenger
  cancel-in-progress: false

jobs:
  improve-s6e10:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide if experiment/recovery is safe
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode || 'run' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, datetime
          from pathlib import Path
          p=Path("state/v2_8_status.json")
          state=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          ladder=Path("state/dual_ladder.json")
          focus=json.loads(ladder.read_text(encoding="utf-8")).get("active_competition") if ladder.exists() else "playground-series-s6e10"
          now=datetime.datetime.now(datetime.timezone.utc)
          cutoff=datetime.datetime(2026,11,1,tzinfo=datetime.timezone.utc)
          finished={"complete","skipped_no_cv_gain","gpu_unavailable","kernel_failed","incomparable_results","artifacts_missing","inactive_competition"}
          allowed=state.get("stage") not in finished and focus=="playground-series-s6e10" and now < cutoff
          explicit=os.environ.get("EVENT_NAME")=="workflow_dispatch"
          mode=os.environ.get("INPUT_MODE","run")
          if not explicit and state.get("kernel"):
            mode="recover_existing"
          print("should_run="+("true" if allowed else "false"))
          print("mode="+mode)
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: "3.11"

      - name: Install controller/test dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt scikit-learn lightgbm xgboost scipy

      - name: Verify no label leakage AND strict V2.5 champion file isolation
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m py_compile kaggle_agent/v28_catboost_gpu_train.py kaggle_agent/v28_catboost_pipeline.py kaggle_agent/v28_guide.py
          python -m unittest discover -s tests -p test_v28.py -v

      - name: Recover queued CUDA kernel or separately retrieve already submitted Public LB
        if: steps.gate.outputs.should_run == 'true'
        env:
          EXEC_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          if [ "$EXEC_MODE" = "recover_existing" ]; then
            python kaggle_agent/v28_catboost_pipeline.py --recover-only
          else
            python kaggle_agent/v28_catboost_pipeline.py
          fi

      - name: Archive Kaggle experiment diagnostics even if Git writeback fails
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v28-gpu-catboost-diagnostics
          path: |
            state/v2_8_status.json
            reports/v2_8_latest.md
            competitions/playground-series-s6e10/kaggle_gpu_v28/
            competitions/playground-series-s6e10/results_v28/metrics.json
            competitions/playground-series-s6e10/results_v28/hardware.json
          if-no-files-found: warn

      - name: Commit only V2.8 state, not data or other live contest files
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          git add -A -- state/v2_8_status.json reports/v2_8_latest.md competitions/playground-series-s6e10/kaggle_gpu_v28/ competitions/playground-series-s6e10/results_v28/
          if git diff --cached --quiet; then
            echo "V2.8 no new report changes."
            exit 0
          fi
          git commit -m "bot: V2.8 TE and route-profile GPU challenger"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt*2))
          done
          exit 1

      - name: Announce evaluation stage without inventing leaderboard score
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("state/v2_8_status.json").read_text(encoding="utf-8"))
          print("V2.8 stage:",state.get("stage"))
          print("Best CV:",(state.get("metrics") or {}).get("best_cv_auc"))
          print("Kaggle public score:",(state.get("latest_submission") or {}).get("publicScore"))
          print("Verified model submission:",state.get("submitted"))
          print("Latest rank via separate authenticated report: reports/score_rank_latest.md")
          print("Kaggle notebook:",state.get("kernel_url"))
          PY
