name: Kaggle V2.9.13 RealMLP Ens8 T4 (No Submit)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Create unique T4 RealMLP Notebook ONCE or recover existing"
        type: choice
        required: false
        default: run
        options: [run, recover_existing]
  push:
    branches:
      - feature/v29-autonomous-evolution
    paths:
      - ".github/workflows/kaggle_v2913_realmlp_ens8.yml"
      - "kaggle_agent/v2913_*.py"
      - "tests/test_v2913_*.py"

permissions:
  contents: write

concurrency:
  group: kaggle-v2913-realmlp-ens8-single-t4
  cancel-in-progress: false

jobs:
  gpu-ens8:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
      REQUESTED_MODE: ${{ inputs.mode || 'run' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v29-autonomous-evolution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Strict eligibility, prior official Kaggle LB, and dedupe
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from datetime import datetime,timezone
          import json,os
          def read(path):
              f=Path("state")/path
              return json.loads(f.read_text()) if f.exists() else {}
          ladder=read("dual_ladder.json")
          s=read("v2_9_13_status.json")
          previous=read("v2_9_12_status.json")
          cv=read("v2_9_9_status.json")
          submitted=read("v2_9_9_submission.json")
          terminal={"candidate_ready_unsubmitted","skipped_no_cv_gain",
                    "kernel_failed","output_failed","validation_mismatch",
                    "push_failed","kernel_access_error"}
          try:
              deadline=datetime.fromisoformat(str(ladder.get("active_deadline","")).replace("Z","+00:00"))
              open_now=deadline.tzinfo is not None and datetime.now(timezone.utc)<deadline
          except ValueError:
              open_now=False
          allowed=(open_now and ladder.get("active_competition")=="playground-series-s6e10"
              and previous.get("stage") in ("skipped_no_cv_gain","candidate_ready_unsubmitted")
              and cv.get("stage")=="candidate_ready_unsubmitted"
              and abs(float(cv.get("candidate_cv",0))-.9610561936366048)<.000002
              and submitted.get("stage")=="complete" and submitted.get("submitted") is True
              and str((submitted.get("submission") or {}).get("ref"))=="57421208"
              and s.get("stage") not in terminal)
          mode=os.environ.get("REQUESTED_MODE") or "run"
          if s.get("kernel"):mode="recover_existing"
          print("allowed="+str(allowed).lower())
          print("mode="+mode)
          PY

      - name: Install owner-authenticated Kaggle CLI + scientific verifier
        if: steps.gate.outputs.allowed == 'true'
        run: python -m pip install -r requirements.txt numpy pandas scipy scikit-learn

      - name: Verify fixed ens8 schedule, T4-only, leakage prevention and no submission
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          python -m py_compile kaggle_agent/v2913_realmlp_ens8_train.py kaggle_agent/v2913_pipeline.py
          python -m unittest discover -s tests -p 'test_v2913_*.py' -v

      - name: Exactly one T4 Notebook creation OR existing-kernel read-only recovery
        id: experiment
        if: steps.gate.outputs.allowed == 'true'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          set -euo pipefail
          test "$KAGGLE_USERNAME" = "mjw3177109"
          test -n "$KAGGLE_API_TOKEN"
          if test "$MODE" = "recover_existing"; then
            python kaggle_agent/v2913_pipeline.py --recover-only
          else
            python kaggle_agent/v2913_pipeline.py
          fi

      - name: Persist honest stage and result, never raw OOF/test labels
        if: always() && steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          git add -A -- state/v2_9_13_status.json state/v2_9_experiments.json reports/v2_9_13_realmlp_ens8.md
          if test -d competitions/playground-series-s6e10/kaggle_gpu_v2913; then
            git add -A -- competitions/playground-series-s6e10/kaggle_gpu_v2913/
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: V2913 real T4 neural ensemble8 experiment evidence"
          for attempt in 1 2 3; do
            git pull --rebase origin feature/v29-autonomous-evolution
            if git push origin HEAD:feature/v29-autonomous-evolution; then exit 0; fi
            sleep "$((attempt*3))"
          done
          exit 1

      - name: Archive only vetted state/report metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2913-realmlp-ens8-evidence
          path: |
            state/v2_9_13_status.json
            reports/v2_9_13_realmlp_ens8.md
          if-no-files-found: ignore
