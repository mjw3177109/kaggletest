name: Kaggle V2.9.29 Fullservice Ordinal RealMLP T4 Single Experiment
# V2929 2026-10-24T11:45Z: first run tests blocked launch, fixed isolated status+slug; strict owner gate and recover-only on saved slug.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Safely run a unique Notebook once, otherwise only recover"
        type: choice
        required: false
        default: run
        options:
          - run
          - recover_only
  push:
    branches:
      - feature/v29-autonomous-evolution
    paths:
      - ".github/workflows/kaggle_v2929_fullservice_ordinal_realmlp.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: kaggle-s6e10-v2929-single-notebook
  cancel-in-progress: false

jobs:
  guarded-fullservice-ordinal-oofer:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
      GH_API_TOKEN: ${{ github.token }}
      REQUESTED_MODE: ${{ inputs.mode || 'run' }}
    steps:
      - name: Check out branch, preserving immutable status
        uses: actions/checkout@v4
        with:
          ref: feature/v29-autonomous-evolution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Independent preregistration, deadline and no-active-run gate
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, json, urllib.request, urllib.parse
          from pathlib import Path
          from datetime import datetime, timezone
          def read(p):
              f=Path("state")/p
              return json.loads(f.read_text(encoding="utf-8")) if f.exists() else {}
          s=read("v2_9_29_status.json")
          v28=read("v2_9_28_status.json")
          champ=read("v2_9_15_status.json")
          official=read("v2_9_15_submission.json")
          rank=read("score_rank_latest.json")
          ladder=read("dual_ladder.json")
          try:
              deadline=datetime.fromisoformat(ladder["active_deadline"].replace("Z","+00:00"))
              timely=deadline.tzinfo is not None and datetime.now(timezone.utc)<deadline
          except (ValueError,KeyError,TypeError):
              timely=False
          owner="mjw3177109/kas-v2929-fullservice-ordinal-realmlp-t4-s6e10"
          stored=s.get("kernel")
          frozen={"baseline_features":37,"new_threshold_features":65,
                  "new_dual_service_features":8,"feature_count":110,
                  "original_service_count":13,"thresholds":[1,2,3,4,5],
                  "outer_folds":3,"seed":20261018,"model_seed":20261029,
                  "epochs":5,"n_ens":8}
          safe=(timely and ladder.get("active_competition")=="playground-series-s6e10"
            and s.get("competition")=="playground-series-s6e10"
            and s.get("version")=="V2.9.29"
            and s.get("intended_kernel")==owner
            and s.get("stage") in {"preregistered_not_started","kernel_queued","kernel_running","pushing_kernel"}
            and stored in ("",None,owner)
            and (s.get("stage")!="preregistered_not_started"
                 or (not stored and s.get("notebook_created") is False
                     and s.get("training_started") is False))
            and all(s.get(k)==v for k,v in frozen.items())
            and all(s.get(k) is False for k in ("submitted","submission_attempted",
                    "external_labels","pseudo_labels","route_features","pca_features",
                    "travel_gated_experts"))
            and s.get("use_fold_local_imputation") is True
            and s.get("use_fold_local_category_vocabulary") is True
            and s.get("hypothesis")=="full_service_ordinal_threshold_realmlp"
            and s.get("model_family")=="global_RealMLP_TD_T4"
            and s.get("feature_family")=="v2915_baseline_plus_13x5_service_ordinal_thresholds_plus_8_dual_service_cats"
            and s.get("blend")=={"v2915_rank":0.85,"v2929_rank":0.15}
            and s.get("promotion")=={"min_cv":0.96125635576833,
                "min_gain_vs_v2915":0.00005,"min_positive_folds":2,
                "worst_fold_strict_gt":-0.00005}
            and s.get("submission_policy")=="evaluation_only_no_submission"
            and v28.get("stage")=="skipped_no_cv_gain"
            and v28.get("submitted") is False
            and v28.get("kernel_state")=="kernel_complete"
            and (v28.get("source_artifacts") or {}).get("v2928",{}).get("sha256")
                =="8e44f204de4f7e67648e081d9c4f48782984f2927bbabe6475a2c9bc1ff1357c"
            and abs(float((v28.get("comparison") or {}).get("candidate_auc",0))
                    -.9612196682704917)<1e-12
            and champ.get("candidate_test_hash")==official.get("prediction_hash")
            and official.get("stage")=="complete"
            and official.get("submitted") is True
            and str((official.get("submission") or {}).get("ref"))=="57446286"
            and abs(float(official.get("official_lb",0))-.96099)<1e-9
            and str((rank.get("score") or {}).get("submission_id"))=="57446286"
            and abs(float((rank.get("score") or {}).get("public_score",0))-.96099)<1e-9)
          # Authenticated GitHub Actions API must prove no other live job exists.
          token=os.getenv("GH_API_TOKEN","")
          repo=os.getenv("GITHUB_REPOSITORY","")
          own=int(os.getenv("GITHUB_RUN_ID","0"))
          if not token or repo!="mjw3177109/kaggletest" or not own:
              raise SystemExit("Cannot authenticate GitHub Actions running-job gate")
          for status in ("in_progress","queued","waiting","requested","pending"):
              query=urllib.parse.urlencode({
                "status":status,"per_page":100})
              url=f"https://api.github.com/repos/{repo}/actions/runs?{query}"
              req=urllib.request.Request(url,headers={
                "Authorization":"Bearer "+token,
                "Accept":"application/vnd.github+json",
                "User-Agent":"kaggle-autoscientist-v2929"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload=json.load(response)
              competitors=[r for r in payload.get("workflow_runs",[])
                           if int(r.get("id",0))!=own]
              if competitors or len(payload.get("workflow_runs", [])) >= 100:
                  safe=False
          mode="recover_only" if stored else (os.getenv("REQUESTED_MODE") or "run")
          if mode not in {"run","recover_only"}:
              raise SystemExit("Unrecognized request mode")
          if stored:
              mode="recover_only"
          print("allowed="+str(bool(safe)).lower())
          print("mode="+mode)
          print("reason="+("strict_preregistered_gate_passed" if safe else "preflight_or_concurrent_actions_blocked"))
          PY
      - name: Pin historical scientific and Kaggle dependencies
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m pip install numpy==2.4.6 pandas==3.0.6 scipy==1.17.1 scikit-learn==1.9.1
      - name: Compile new trainer and execute fold isolation tests
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          python -m py_compile kaggle_agent/v2929_fullservice_ordinal_realmlp_train.py kaggle_agent/v2929_pipeline.py
          python -m unittest discover -s tests -p 'test_v2929_fullservice_ordinal_realmlp.py' -v
      - name: Verify previous Kaggle experiment owners are terminal before new GPU training
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          for slug in (
              "mjw3177109/kas-v2927-travel-gated-dual-realmlp-t4-s6e10",
              "mjw3177109/kas-v2928-service-factor-pca-lgbm-cpu-s6e10",
          ):
              result=subprocess.run(["kaggle","kernels","status",slug],
                                    capture_output=True,text=True,timeout=90)
              if result.returncode or "KernelWorkerStatus.COMPLETE" not in result.stdout:
                  raise SystemExit("Previous Kaggle Notebook is not certified COMPLETE; refuse new GPU training")
          print("Prior V2927/V2928 Kaggle owners both certified COMPLETE")
          PY
      - name: Create one owner-authenticated Notebook or recover only the recorded one
        if: steps.gate.outputs.allowed == 'true'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          set -euo pipefail
          test "$KAGGLE_USERNAME" = "mjw3177109"
          test -n "$KAGGLE_API_TOKEN"
          if test "$MODE" = "recover_only"; then
            python kaggle_agent/v2929_pipeline.py --recover-only
          else
            python kaggle_agent/v2929_pipeline.py
          fi
      - name: Persist exact saved kernel ID and evidence to original branch
        if: always() && steps.gate.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          for file in state/v2_9_29_status.json state/v2_9_experiments.json reports/v2_9_29_result.md; do
            if test -f "$file"; then git add -- "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: persist V2929 fullservice-ordinal dual RealMLP unique Notebook evidence"
          for attempt in 1 2 3 4; do
            git fetch origin feature/v29-autonomous-evolution
            git rebase origin/feature/v29-autonomous-evolution
            if git push origin HEAD:feature/v29-autonomous-evolution; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1
      - name: Archive compact status only, not underlying Kaggle competition data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2929-fullservice-ordinal-realmlp-status
          path: |
            state/v2_9_29_status.json
            reports/v2_9_29_result.md
          if-no-files-found: ignore
