name: Kaggle V2.9.34 DeepFM CPU Safety Only
# No Kaggle credentials, Notebook push, training or competition submission in this workflow.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/v29-autonomous-evolution
    paths:
      - ".github/workflows/kaggle_v2934_cpu_safety.yml"
      - "kaggle_agent/v2934_deepfm_train.py"
      - "kaggle_agent/v2934_pipeline.py"
      - "kaggle_agent/v2934_actions_gate.py"
      - "tests/test_v2934_deepfm.py"
permissions:
  contents: read
jobs:
  cpu-only-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v29-autonomous-evolution
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated CPU verification dependencies
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3 scikit-learn==1.6.1 PyYAML==6.0.2
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run frozen V2934 safety suite
        run: |
          set -euo pipefail
          python -m py_compile kaggle_agent/v2934_deepfm_train.py kaggle_agent/v2934_pipeline.py kaggle_agent/v2934_actions_gate.py
          python -m unittest discover -s tests -p 'test_v2934_deepfm.py' -v
