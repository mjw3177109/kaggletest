name: Kaggle V2.3 TPU Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaggle_v23_recover.yml"
  schedule:
    - cron: "27 */3 * * *"

permissions:
  contents: write

concurrency:
  group: kaggle-v23-recovery
  cancel-in-progress: false

jobs:
  recover-existing-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine if this Kaggle queue still needs recovery
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json
          from pathlib import Path
          p=Path("state/v2_3_status.json")
          d=json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          s=d.get("stage")
          before_deadline=datetime.datetime.now(datetime.timezone.utc) < datetime.datetime(2026, 11, 1, tzinfo=datetime.timezone.utc)
          active=s in ("kernel_queued", "kernel_running")
          ladder_p=Path("state/dual_ladder.json")
          ladder=json.loads(ladder_p.read_text(encoding="utf-8")) if ladder_p.exists() else {}
          still_current=ladder.get("active_competition", d.get("competition")) == d.get("competition")
          should=(active and before_deadline and still_current) or ( __import__("os").environ.get("EVENT_NAME") == "workflow_dispatch" )
          print("should_run=" + ("true" if should else "false"))
          PY

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.should_run == 'true'
        with:
          python-version: "3.11"

      - name: Install Kaggle controller dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Check existing Kaggle TPU Notebook (NO training push)
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python -m py_compile kaggle_agent/v23_tpu_pipeline.py
          python kaggle_agent/v23_tpu_pipeline.py --recover-only

      - name: Preserve diagnostic artifacts even if Git rebase fails
        if: always() && steps.guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v23-tpu-recovery-diagnostics
          path: |
            state/v2_3_status.json
            reports/v2_3_latest.md
            competitions/playground-series-s6e10/kaggle_tpu_v23/status_output.txt
            competitions/playground-series-s6e10/kaggle_tpu_v23/logs.txt
            competitions/playground-series-s6e10/results_v23/hardware.json
            competitions/playground-series-s6e10/results_v23/metrics.json
          if-no-files-found: warn

      - name: Commit only V2.3 recovery files (avoid guide conflicts)
        if: steps.guard.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "kaggle-auto-scientist[bot]"
          git config user.email "kaggle-auto-scientist[bot]@users.noreply.github.com"
          git add -A -- state/v2_3_status.json reports/v2_3_latest.md competitions/
          if git diff --cached --quiet; then
            echo "No new recovery changes."
            exit 0
          fi
          git commit -m "bot: recover V2.3 existing Kaggle TPU results"
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Conflict while rebasing diagnostic outputs"
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Diagnostic results stored on main"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not push diagnostics after five bounded retries"
          exit 1

      - name: Print verified stage
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("state/v2_3_status.json").read_text(encoding="utf-8"))
          print("V2.3 stage:", d.get("stage"))
          print("Confirmed backend:", (d.get("hardware") or {}).get("actual"))
          print("TPU CV:", (d.get("metrics") or {}).get("cv_auc"))
          print("Submitted:", d.get("submitted"))
          PY
